[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contribution-maker"
version = "1.0.0"
description = "Backdate synthetic commits to fill a GitHub contribution graph"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ALFRED-OP" }]

[project.scripts]
contribution-maker = "main:main"

[tool.setuptools]
py-modules = ["main"]
